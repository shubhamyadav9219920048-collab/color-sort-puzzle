name: Build Android APK and AAB

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: |
          if command -v bun >/dev/null 2>&1; then
            bun install
          else
            npm install
          fi

      - name: Build web application
        run: |
          if command -v bun >/dev/null 2>&1; then
            bun run build
          else
            npm run build
          fi

      - name: Sync Capacitor Android
        run: |
          if command -v bunx >/dev/null 2>&1; then
            bunx cap sync android
          else
            npx cap sync android
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Verify Gradle wrapper files
        run: |
          chmod +x android/gradlew
          if [ ! -f "android/gradle/wrapper/gradle-wrapper.jar" ] || [ ! -s "android/gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Wrapper jar missing or empty, downloading valid Gradle 8.11.1 wrapper jar..."
            mkdir -p android/gradle/wrapper
            curl -sSL -o android/gradle/wrapper/gradle-wrapper.jar "https://raw.githubusercontent.com/gradle/gradle/v8.11.1/gradle/wrapper/gradle-wrapper.jar"
          fi
          ls -la android/gradle/wrapper/

      - name: Build Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace --no-daemon
          mkdir -p ../release-artifacts
          find app/build/outputs/apk/ -type f -name "*.apk" -exec cp {} ../release-artifacts/app-release.apk \;

      - name: Build Android Release AAB (App Bundle)
        run: |
          cd android
          ./gradlew bundleRelease --stacktrace --no-daemon
          mkdir -p ../release-artifacts
          find app/build/outputs/bundle/ -type f -name "*.aab" -exec cp {} ../release-artifacts/app-release.aab \;

      - name: List and Verify Generated Artifacts
        run: |
          echo "=== Release Artifacts Generated ==="
          ls -lh release-artifacts/
          test -f release-artifacts/app-release.apk || (echo "Error: app-release.apk was not generated" && exit 1)
          test -f release-artifacts/app-release.aab || (echo "Error: app-release.aab was not generated" && exit 1)

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: release-artifacts/app-release.apk
          if-no-files-found: error

      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: release-artifacts/app-release.aab
          if-no-files-found: error
